name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/debug/app-debug.apk build-assets/StorageAnalyzer.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageAnalyzer-APK
          path: build-assets/StorageAnalyzer.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Storage Analyzer v1.0.0
          body: |
            ### 📱 Storage Analyzer for Android
            Download and install **StorageAnalyzer.apk** directly on your Android phone (Android 11+).

            #### Features:
            - **Storage Bar & Scan**: live device storage overview
            - **Apps Overview**: App size, User data, and clearable Cache
            - **App Detail**: In-depth app data breakdown + files saved in shared storage
            - **Cache Cleaner**: Ranked by clearable cache with quick clear shortcuts
            - **Category Browser**: Photos, Videos, Audio, Documents, and Others (1 MB+)
            - **WhatsApp Media Cleaner**: Sent vs Received copies, statuses, and voice notes
            - **Leftover Folders**: Detection and safe deletion of residual folders from uninstalled apps
            - **Hidden & Trash**: Finds gallery trash (`.trashed-*`), pending files (`.pending-*`), `.nomedia` folders, and thumbnail caches
          draft: false
          prerelease: false
          files: build-assets/StorageAnalyzer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
